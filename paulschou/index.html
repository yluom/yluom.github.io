<!DOCTYPE html>
<!--
  Paulschou Converter: live ASCII / Decimal / Binary / Hex / Base64 converter.
  Copy buttons on every panel; one output separator setting (space or none) for
  Decimal, Binary and Hex, saved in localStorage (issue #3). Error messages, size
  counters, Clear all with undo, optional dark mode (saved). Tests: tests/README.md
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paulschou Converter - ASCII/Binary/Hex</title>
    <meta name="description" content="Online utility to convert ASCII/ANSI, HEX, Binary, Base64, etc.">
    <meta name="keywords" content="converter,binary,hexadecimal,binary encoder,binary decoder,binary translator,binary tools,binary converter,hexadecimal encoder/decoder,base 64">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f5f5f5;
            --panel-bg: #ffffff;
            --input-bg: #fafafa;
            --border: #e0e0e0;
            --border-hover: #ccc;
            --text: #333;
            --text-light: #666;
            --text-muted: #999;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.1);

            /* Format colors */
            --color-text: #4a7c9b;
            --color-dec: #c17f24;
            --color-bin: #3a9a5b;
            --color-hex: #7c5bad;
            --color-b64: #2a9d8f;

            /* State colors */
            --on-color: #fff;       /* text on a format color */
            --focus-bg: #fff;
            --error: #e53e3e;
            --error-bg: #fff5f5;
            --warn: #b7791f;
        }

        /* Dark theme: opt-in via the toggle in the top-right corner */
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #16171b;
            --panel-bg: #1f2026;
            --input-bg: #18191e;
            --border: #30323a;
            --border-hover: #474a55;
            --text: #e4e4e8;
            --text-light: #b0b1ba;
            --text-muted: #80828d;
            --shadow: 0 2px 8px rgba(0,0,0,0.35);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.5);

            --color-text: #72aed3;
            --color-dec: #e2a64a;
            --color-bin: #5cc581;
            --color-hex: #ad92dd;
            --color-b64: #4cc4b4;

            --on-color: #121317;
            --focus-bg: #1b1c21;
            --error: #f07070;
            --error-bg: #2b1b1d;
            --warn: #e2a64a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans 3', Arial, Helvetica, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .theme-toggle:hover {
            color: var(--text);
            background: var(--panel-bg);
        }

        .theme-toggle:focus-visible {
            outline: 2px solid var(--color-text);
            outline-offset: 1px;
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
        }

        .theme-toggle .icon-sun { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .intro {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Grid */
        .converter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        @media (max-width: 640px) {
            .converter-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Panel */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
            position: relative;
            border-left: 3px solid var(--border);
        }

        .panel:hover {
            box-shadow: var(--shadow-hover);
        }

        /* Panel color variants */
        .panel[data-format="text"] { --panel-color: var(--color-text); }
        .panel[data-format="dec"] { --panel-color: var(--color-dec); }
        .panel[data-format="bin"] { --panel-color: var(--color-bin); }
        .panel[data-format="hex"] { --panel-color: var(--color-hex); }
        .panel[data-format="b64"] { --panel-color: var(--color-b64); }

        /* Active source state */
        .panel.is-source {
            border-left-color: var(--panel-color);
            background: linear-gradient(90deg, color-mix(in srgb, var(--panel-color) 4%, var(--panel-bg)) 0%, var(--panel-bg) 100%);
        }

        .panel.is-source .panel-badge {
            background: var(--panel-color);
            color: var(--on-color);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .panel-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
        }

        .panel-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s;
        }

        .panel.is-source .panel-title a {
            color: var(--panel-color);
        }

        .panel-title a:hover {
            opacity: 0.8;
        }

        .panel-badge {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: var(--input-bg);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 0.75rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text);
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            transition: all 0.2s ease;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        textarea:focus {
            outline: none;
            border-color: var(--panel-color, var(--border));
            background: var(--focus-bg);
        }

        .panel.is-source textarea {
            border-color: color-mix(in srgb, var(--panel-color) 40%, transparent);
        }

        /* Invalid input state */
        .panel.is-invalid textarea {
            border-color: var(--error);
            background: var(--error-bg);
        }

        .panel.is-invalid .panel-badge {
            background: var(--error);
            color: var(--on-color);
        }

        /* Text panel spans full width */
        .panel-text {
            grid-column: 1 / -1;
        }

        .panel-text textarea {
            height: 80px;
        }

        /* Footer */
        footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .credits {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .credits a {
            color: var(--color-text);
            text-decoration: none;
        }

        .credits a:hover {
            text-decoration: underline;
        }

        .credits .sep {
            color: var(--border);
        }

        /* ---- Issue #3: copy buttons + separator options ---- */
        .panel-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            height: 24px;
            min-width: 24px;
            padding: 0 0.3rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--panel-bg);
            color: var(--text-light);
            font: inherit;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .icon-btn:hover:not(:disabled) {
            border-color: var(--panel-color, var(--border-hover));
            color: var(--panel-color, var(--text));
        }

        .icon-btn:focus-visible,
        .seg input:focus-visible + span {
            outline: 2px solid var(--panel-color, var(--color-text));
            outline-offset: 1px;
        }

        .icon-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .icon-btn svg {
            width: 14px;
            height: 14px;
        }

        .icon-btn .icon-check { display: none; }
        .icon-btn.is-copied { border-color: var(--color-bin); color: var(--color-bin); }
        .icon-btn.is-copied .icon-copy { display: none; }
        .icon-btn.is-copied .icon-check { display: inline; }

        .seg {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .seg label {
            position: relative;
            cursor: pointer;
        }

        .seg input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .seg span {
            display: block;
            padding: 0 0.45rem;
            line-height: 22px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--panel-bg);
            white-space: pre;
            transition: all 0.15s ease;
        }

        .seg label + label span {
            border-left: 1px solid var(--border);
        }

        .seg input:checked + span {
            background: var(--panel-color);
            color: var(--on-color);
        }

        .sep-warning {
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: var(--warn);
        }

        .toolbar {
            --panel-color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .toolbar .seg span {
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0 0.7rem;
            line-height: 26px;
        }

        .icon-btn { padding: 0 0.5rem; }

        @media (pointer: coarse) {
            .icon-btn { height: 32px; min-width: 32px; }
            .seg span { line-height: 30px; padding: 0 0.6rem; }
        }

        /* Message + size counter row under each field */
        .panel-meta {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-top: 0.35rem;
            min-height: 1.1rem;
            font-size: 0.75rem;
        }

        .field-msg {
            min-width: 0;
            color: var(--warn);
        }

        .field-msg.is-error {
            color: var(--error);
        }

        .count {
            margin-left: auto;
            color: var(--text-muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* Other fields while the field being typed in is invalid */
        .panel.is-stale textarea {
            opacity: 0.45;
        }

        .toolbar-divider {
            width: 1px;
            height: 18px;
            background: var(--border);
        }

        @media (max-width: 480px) {
            .toolbar-divider { display: none; }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    <script>
        // Apply the saved theme before the page paints (light by default).
        try {
            if (localStorage.getItem('paulschou.theme') === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) { /* storage unavailable: light */ }
    </script>
</head>
<body>
    <div class="container">
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Dark mode" aria-pressed="false" title="Dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <header>
            <h1>Paulschou Converter</h1>
            <p class="intro">Live encode & decode — type in any field</p>
        </header>

        <div class="toolbar">
            <span class="toolbar-label" id="sep-all-label">Separator in Decimal · Binary · Hex</span>
            <div class="seg" role="radiogroup" aria-labelledby="sep-all-label">
                <label><input type="radio" name="sep-all" value="space" data-sep-for="dec bin hex"><span>Space</span></label>
                <label><input type="radio" name="sep-all" value="none" data-sep-for="dec bin hex"><span>None</span></label>
            </div>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button type="button" class="icon-btn" id="clear-all">Clear all</button>
        </div>

        <main class="converter-grid">
            <!-- Text Input -->
            <div class="panel panel-text" data-format="text">
                <div class="panel-header">
                    <span class="panel-title" id="title-text"><a href="https://en.wikipedia.org/wiki/ASCII" target="_blank">TEXT</a></span>
                    <div class="panel-actions">
                        <span class="panel-badge">TXT</span>
                        <button type="button" class="icon-btn" data-copy="text" aria-label="Copy Text" title="Copy Text">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
                            <span class="btn-label">Copy</span>
                        </button>
                    </div>
                </div>
                <textarea id="text-input" placeholder="Enter your text here..." aria-labelledby="title-text" aria-describedby="count-text"></textarea>
                <div class="panel-meta">
                    <span class="count" id="count-text" data-count-for="text"></span>
                </div>
            </div>

            <!-- ASCII Decimal -->
            <div class="panel" data-format="dec">
                <div class="panel-header">
                    <span class="panel-title" id="title-dec"><a href="https://en.wikipedia.org/wiki/ASCII" target="_blank">ASCII Decimal</a></span>
                    <div class="panel-actions">
                        <span class="panel-badge">DEC</span>
                        <button type="button" class="icon-btn" data-copy="dec" aria-label="Copy ASCII Decimal" title="Copy ASCII Decimal">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
                            <span class="btn-label">Copy</span>
                        </button>
                    </div>
                </div>
                <textarea id="decimal-input" placeholder="065 083 067 073 073..." aria-labelledby="title-dec" aria-describedby="msg-dec count-dec"></textarea>
                <div class="panel-meta">
                    <p class="field-msg" id="msg-dec" data-msg-for="dec" hidden></p>
                    <span class="count" id="count-dec" data-count-for="dec"></span>
                </div>
                <p class="sep-warning" data-warn-for="dec" hidden></p>
            </div>

            <!-- Binary -->
            <div class="panel" data-format="bin">
                <div class="panel-header">
                    <span class="panel-title" id="title-bin"><a href="https://en.wikipedia.org/wiki/Binary_code" target="_blank">Binary</a></span>
                    <div class="panel-actions">
                        <span class="panel-badge">BIN</span>
                        <button type="button" class="icon-btn" data-copy="bin" aria-label="Copy Binary" title="Copy Binary">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
                            <span class="btn-label">Copy</span>
                        </button>
                    </div>
                </div>
                <textarea id="binary-input" placeholder="01001000 01100101 01101100..." aria-labelledby="title-bin" aria-describedby="msg-bin count-bin"></textarea>
                <div class="panel-meta">
                    <p class="field-msg" id="msg-bin" data-msg-for="bin" hidden></p>
                    <span class="count" id="count-bin" data-count-for="bin"></span>
                </div>
                <p class="sep-warning" data-warn-for="bin" hidden></p>
            </div>

            <!-- Hexadecimal -->
            <div class="panel" data-format="hex">
                <div class="panel-header">
                    <span class="panel-title" id="title-hex"><a href="https://en.wikipedia.org/wiki/Hexadecimal" target="_blank">Hexadecimal</a></span>
                    <div class="panel-actions">
                        <span class="panel-badge">HEX</span>
                        <button type="button" class="icon-btn" data-copy="hex" aria-label="Copy Hexadecimal" title="Copy Hexadecimal">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
                            <span class="btn-label">Copy</span>
                        </button>
                    </div>
                </div>
                <textarea id="hex-input" placeholder="48 65 6c 6c 6f..." aria-labelledby="title-hex" aria-describedby="msg-hex count-hex"></textarea>
                <div class="panel-meta">
                    <p class="field-msg" id="msg-hex" data-msg-for="hex" hidden></p>
                    <span class="count" id="count-hex" data-count-for="hex"></span>
                </div>
                <p class="sep-warning" data-warn-for="hex" hidden></p>
            </div>

            <!-- Base64 -->
            <div class="panel" data-format="b64">
                <div class="panel-header">
                    <span class="panel-title" id="title-b64"><a href="https://en.wikipedia.org/wiki/Base64" target="_blank">Base64</a></span>
                    <div class="panel-actions">
                        <span class="panel-badge">B64</span>
                        <button type="button" class="icon-btn" data-copy="b64" aria-label="Copy Base64" title="Copy Base64">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
                            <span class="btn-label">Copy</span>
                        </button>
                    </div>
                </div>
                <textarea id="base64-input" placeholder="SGVsbG8gV29ybGQ=" aria-labelledby="title-b64" aria-describedby="msg-b64 count-b64"></textarea>
                <div class="panel-meta">
                    <p class="field-msg" id="msg-b64" data-msg-for="b64" hidden></p>
                    <span class="count" id="count-b64" data-count-for="b64"></span>
                </div>
            </div>
        </main>

        <div class="sr-only" aria-live="polite" id="copy-status"></div>

        <footer>
            <div class="credits">
                <span>Coucou freulere</span>
                <span>Original code: <a href="https://home.paulschou.net/tools/xlate/" target="_blank">Paul Schou</a></span>
                <span class="sep">·</span>
                <span>Original idea: <a href="https://x.com/nciske" target="_blank">Nick Ciske</a></span>
                <span class="sep">·</span>
                <span><a href="https://github.com/yluom/yluom.github.io/tree/main/paulschou" target="_blank">Source code</a></span>
            </div>
        </footer>
    </div>

    <script>
        const inputs = {
            text: document.getElementById('text-input'),
            dec: document.getElementById('decimal-input'),
            bin: document.getElementById('binary-input'),
            hex: document.getElementById('hex-input'),
            b64: document.getElementById('base64-input')
        };

        const panels = document.querySelectorAll('.panel');

        // ---- Separator preferences (issue #3) ----
        const SEP = { space: ' ', none: '' };
        const SEP_FORMATS = ['dec', 'bin', 'hex'];
        const SEP_STORAGE_KEY = 'paulschou.separators';
        const prefs = loadPrefs();

        function loadPrefs() {
            const p = { dec: 'space', bin: 'space', hex: 'space' };
            try {
                const saved = JSON.parse(localStorage.getItem(SEP_STORAGE_KEY));
                if (saved) SEP_FORMATS.forEach(f => { if (saved[f] in SEP) p[f] = saved[f]; });
            } catch (e) { /* storage unavailable: keep defaults */ }
            return p;
        }

        function savePrefs() {
            try { localStorage.setItem(SEP_STORAGE_KEY, JSON.stringify(prefs)); }
            catch (e) { /* ignore */ }
        }
        let currentSource = null;

        function setSource(format) {
            panels.forEach(p => p.classList.remove('is-source'));
            if (format) {
                document.querySelector(`[data-format="${format}"]`).classList.add('is-source');
            }
            currentSource = format;
        }

        function setInvalid(format, isInvalid) {
            const panel = document.querySelector(`[data-format="${format}"]`);
            panel.classList.toggle('is-invalid', isInvalid);
            if (isInvalid) inputs[format].setAttribute('aria-invalid', 'true');
            else inputs[format].removeAttribute('aria-invalid');
        }

        // Validation functions
        function isValidDecimal(val) {
            return !val || /^[\d\s]*$/.test(val);
        }

        function isValidBinary(val) {
            return !val || /^[01\s]*$/.test(val);
        }

        function isValidHex(val) {
            return !val || /^[0-9a-fA-F\s]*$/.test(val);
        }

        function isValidBase64(val) {
            return !val || /^[A-Za-z0-9+/=\s]*$/.test(val);
        }

        // Encoding functions
        // `sep` defaults to a space so the original output is unchanged.
        function textToDecimal(text, sep = ' ') {
            return Array.from(text).map(c =>
                c.charCodeAt(0).toString().padStart(3, '0')
            ).join(sep);
        }

        function textToBinary(text, sep = ' ') {
            return Array.from(text).map(c =>
                c.charCodeAt(0).toString(2).padStart(8, '0')
            ).join(sep);
        }

        function textToHex(text, sep = ' ') {
            return Array.from(text).map(c =>
                c.charCodeAt(0).toString(16).padStart(2, '0')
            ).join(sep);
        }

        function textToBase64(text) {
            try {
                return btoa(unescape(encodeURIComponent(text)));
            } catch (e) {
                return '';
            }
        }

        // Decoding functions
        function decimalToText(decimal) {
            if (!decimal.trim()) return '';
            return decimalCodes(decimal).map(c => {
                const n = parseInt(c, 10);
                return n > 0 ? String.fromCharCode(n) : '';
            }).join('');
        }

        // Splits decimal input into codes (strings of digits).
        function decimalCodes(decimal) {
            if (!decimal.trim()) return [];
            const tokens = decimal.replace(/\D/g, ' ').trim().split(/\s+/);
            // A char code has at most 5 digits (65535). Tokens of 6+ digits can
            // only be codes written without separator ("072101108"): read them
            // as 3-digit groups, ignoring an incomplete trailing group.
            const codes = [];
            tokens.forEach(t => {
                if (t.length < 6) { codes.push(t); return; }
                for (let i = 0; i + 3 <= t.length; i += 3) codes.push(t.substring(i, i + 3));
            });
            return codes;
        }

        function binaryToText(binary) {
            const clean = binary.replace(/[^01]/g, '');
            if (!clean) return '';
            let result = '';
            for (let i = 0; i < clean.length; i += 8) {
                const byte = clean.substring(i, i + 8);
                if (byte.length === 8) {
                    result += String.fromCharCode(parseInt(byte, 2));
                }
            }
            return result;
        }

        function hexToText(hex) {
            const clean = hex.replace(/[^0-9a-fA-F]/g, '');
            if (!clean) return '';
            let result = '';
            for (let i = 0; i < clean.length; i += 2) {
                const byte = clean.substring(i, i + 2);
                if (byte.length === 2) {
                    result += String.fromCharCode(parseInt(byte, 16));
                }
            }
            return result;
        }

        function base64ToText(b64) {
            try {
                return decodeURIComponent(escape(atob(b64.trim())));
            } catch (e) {
                try { return atob(b64.trim()); }
                catch (e2) { return ''; }
            }
        }

        // Update all fields from text
        function updateFromText(text, exclude) {
            // Overwritten fields hold generated, valid content.
            Object.keys(inputs).forEach(f => { if (f !== exclude) setInvalid(f, false); });
            if (exclude !== 'text') inputs.text.value = text;
            if (exclude !== 'dec') inputs.dec.value = text ? textToDecimal(text, SEP[prefs.dec]) : '';
            if (exclude !== 'bin') inputs.bin.value = text ? textToBinary(text, SEP[prefs.bin]) : '';
            if (exclude !== 'hex') inputs.hex.value = text ? textToHex(text, SEP[prefs.hex]) : '';
            if (exclude !== 'b64') inputs.b64.value = text ? textToBase64(text) : '';
        }

        // Live conversion handlers
        inputs.text.addEventListener('input', () => {
            setSource('text');
            updateFromText(inputs.text.value, 'text');
        });

        inputs.dec.addEventListener('input', () => {
            setSource('dec');
            const val = inputs.dec.value;
            const valid = isValidDecimal(val);
            setInvalid('dec', !valid);
            if (valid) {
                const text = decimalToText(val);
                updateFromText(text, 'dec');
            }
        });

        inputs.bin.addEventListener('input', () => {
            setSource('bin');
            const val = inputs.bin.value;
            const valid = isValidBinary(val);
            setInvalid('bin', !valid);
            if (valid) {
                const text = binaryToText(val);
                updateFromText(text, 'bin');
            }
        });

        inputs.hex.addEventListener('input', () => {
            setSource('hex');
            const val = inputs.hex.value;
            const valid = isValidHex(val);
            setInvalid('hex', !valid);
            if (valid) {
                const text = hexToText(val);
                updateFromText(text, 'hex');
            }
        });

        inputs.b64.addEventListener('input', () => {
            setSource('b64');
            const val = inputs.b64.value;
            const valid = isValidBase64(val);
            setInvalid('b64', !valid);
            if (valid) {
                const text = base64ToText(val);
                updateFromText(text, 'b64');
            }
        });

        // Clear source highlight on blur if empty
        Object.values(inputs).forEach(input => {
            input.addEventListener('blur', () => {
                const allEmpty = Object.values(inputs).every(i => !i.value);
                if (allEmpty) setSource(null);
            });
        });
        // ---- Separator controls (issue #3) ----
        // Any element with data-sep-for="dec bin hex" drives those formats:
        // radio (value="space"|"none") or checkbox (checked = space).
        const ENCODERS = { dec: textToDecimal, bin: textToBinary, hex: textToHex };
        // Above these codes, output without separator can't be split back reliably.
        const MAX_UNAMBIGUOUS = { dec: 999, bin: 255, hex: 255 };
        const sepControls = document.querySelectorAll('[data-sep-for]');

        function syncSepControls() {
            sepControls.forEach(el => {
                const modes = new Set(el.dataset.sepFor.split(' ').map(f => prefs[f]));
                const mode = modes.size === 1 ? [...modes][0] : null;
                if (el.type === 'checkbox') {
                    el.checked = mode === 'space';
                    el.indeterminate = mode === null;
                } else {
                    el.checked = el.value === mode;
                }
            });
        }

        function setSeparator(format, mode) {
            prefs[format] = mode;
            // Never rewrite what the user is typing: only re-render outputs.
            if (currentSource !== format) {
                const text = inputs.text.value;
                inputs[format].value = text ? ENCODERS[format](text, SEP[mode]) : '';
            }
        }

        sepControls.forEach(el => {
            el.addEventListener('change', () => {
                const mode = el.type === 'checkbox' ? (el.checked ? 'space' : 'none') : el.value;
                el.dataset.sepFor.split(' ').forEach(f => setSeparator(f, mode));
                savePrefs();
                syncSepControls();
                refreshUi();
            });
        });

        function refreshWarnings() {
            document.querySelectorAll('[data-warn-for]').forEach(el => {
                const f = el.dataset.warnFor;
                const max = MAX_UNAMBIGUOUS[f];
                const ambiguous = prefs[f] === 'none' && currentSource !== f &&
                    Array.from(inputs.text.value).some(c => c.charCodeAt(0) > max);
                el.hidden = !ambiguous;
                el.textContent = ambiguous
                    ? `Contains characters above ${max}: without separator this can't be decoded back reliably.`
                    : '';
            });
        }

        // ---- Copy to clipboard (issue #3) ----
        const copyButtons = document.querySelectorAll('[data-copy]');
        const copyStatus = document.getElementById('copy-status');

        async function copyToClipboard(str) {
            if (navigator.clipboard && window.isSecureContext) {
                try { await navigator.clipboard.writeText(str); return true; }
                catch (e) { /* fall through */ }
            }
            const tmp = document.createElement('textarea');
            tmp.value = str;
            tmp.setAttribute('readonly', '');
            tmp.style.position = 'fixed';
            tmp.style.opacity = '0';
            document.body.appendChild(tmp);
            tmp.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ }
            tmp.remove();
            return ok;
        }

        copyButtons.forEach(btn => {
            let timer;
            btn.addEventListener('click', async () => {
                const f = btn.dataset.copy;
                const name = btn.closest('.panel').querySelector('.panel-title').textContent.trim();
                const ok = await copyToClipboard(inputs[f].value);
                btn.classList.toggle('is-copied', ok);
                const label = btn.querySelector('.btn-label');
                if (label) label.textContent = ok ? 'Copied' : 'Failed';
                copyStatus.textContent = ok ? `${name} copied to clipboard` : `Could not copy ${name}`;
                clearTimeout(timer);
                timer = setTimeout(() => {
                    btn.classList.remove('is-copied');
                    if (label) label.textContent = 'Copy';
                }, 1500);
            });
        });

        function refreshCopyButtons() {
            copyButtons.forEach(btn => { btn.disabled = !inputs[btn.dataset.copy].value; });
        }

        // ---- Error messages and hints under each field ----
        const VALID_CHAR = { dec: /[\d\s]/, bin: /[01\s]/, hex: /[0-9a-fA-F\s]/, b64: /[A-Za-z0-9+/=\s]/ };
        const EXPECTED = {
            dec: 'a decimal digit',
            bin: 'a binary digit (0 or 1)',
            hex: 'a hexadecimal digit (0\u20119, a\u2011f)',
            b64: 'a Base64 character (A\u2011Z, a\u2011z, 0\u20119, +, /, =)'
        };

        const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
        const lastIgnored = (n, word) =>
            n === 1 ? `The last ${word} is ignored` : `The last ${n} ${word}s are ignored`;

        function describeChar(c) {
            return /[\p{L}\p{N}\p{P}\p{S}]/u.test(c)
                ? `"${c}"`
                : 'U+' + c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0');
        }

        function invalidMessage(f, value) {
            const chars = Array.from(value);
            const bad = [];
            chars.forEach((c, i) => { if (!VALID_CHAR[f].test(c)) bad.push(i); });
            if (!bad.length) return '';
            let msg = `${describeChar(chars[bad[0]])} at position ${bad[0] + 1} is not ${EXPECTED[f]}`;
            if (bad.length > 1) msg += ` (${plural(bad.length - 1, 'more invalid character')})`;
            return msg + '. The other fields keep the last valid result.';
        }

        // Valid input that the decoder partly ignores.
        function hintMessage(f, value) {
            if (f === 'hex') {
                if (value.replace(/[^0-9a-fA-F]/g, '').length % 2) {
                    return lastIgnored(1, 'digit') + ': each byte needs 2 hex digits.';
                }
            } else if (f === 'bin') {
                const n = value.replace(/[^01]/g, '').length % 8;
                if (n) return lastIgnored(n, 'bit') + ': each byte needs 8 bits.';
            } else if (f === 'dec') {
                const tokens = value.trim() ? value.trim().split(/\s+/) : [];
                const tooBig = tokens.find(t => t.length < 6 && parseInt(t, 10) > 65535);
                if (tooBig) return `${tooBig} is above 65535, the largest character code.`;
                const cut = tokens.find(t => t.length >= 6 && t.length % 3);
                if (cut) return lastIgnored(cut.length % 3, 'digit') + ': codes without separator are read in groups of 3 digits.';
            } else if (f === 'b64' && value.trim()) {
                try { atob(value.trim()); }
                catch (e) { return 'This Base64 is incomplete: check its length and the "=" padding at the end.'; }
            }
            return '';
        }

        function isInvalidPanel(f) {
            return inputs[f].closest('.panel').classList.contains('is-invalid');
        }

        function refreshMessages() {
            document.querySelectorAll('[data-msg-for]').forEach(el => {
                const f = el.dataset.msgFor;
                const value = inputs[f].value;
                const invalid = isInvalidPanel(f);
                const text = invalid ? invalidMessage(f, value)
                    : currentSource === f ? hintMessage(f, value) : '';
                el.textContent = text;
                el.hidden = !text;
                el.classList.toggle('is-error', invalid && !!text);
            });
            // Grey out results that no longer match the field being typed in.
            const sourceInvalid = !!currentSource && isInvalidPanel(currentSource);
            panels.forEach(p => p.classList.toggle('is-stale',
                sourceInvalid && p.dataset.format !== currentSource));
        }

        // ---- Size counters ----
        const utf8 = new TextEncoder();

        function countLabel(f, value) {
            if (!value) return '';
            const chars = plural(Array.from(value).length, 'char');
            if (isInvalidPanel(f)) return chars;
            if (f === 'text') return `${chars} · ${plural(utf8.encode(value).length, 'byte')} UTF-8`;
            if (f === 'dec') return `${plural(decimalCodes(value).length, 'code')} · ${chars}`;
            if (f === 'bin') return `${plural(Math.floor(value.replace(/[^01]/g, '').length / 8), 'byte')} · ${chars}`;
            if (f === 'hex') return `${plural(Math.floor(value.replace(/[^0-9a-fA-F]/g, '').length / 2), 'byte')} · ${chars}`;
            try { return `${chars} · ${plural(atob(value.trim()).length, 'byte')}`; }
            catch (e) { return chars; }
        }

        function refreshCounts() {
            document.querySelectorAll('[data-count-for]').forEach(el => {
                el.textContent = countLabel(el.dataset.countFor, inputs[el.dataset.countFor].value);
            });
        }

        // ---- Clear all, with undo ----
        const clearBtn = document.getElementById('clear-all');
        let undoState = null;
        let undoTimer;

        function endUndo() {
            if (!undoState) return;
            undoState = null;
            clearTimeout(undoTimer);
            clearBtn.textContent = 'Clear all';
        }

        clearBtn.addEventListener('click', () => {
            if (undoState) {
                const state = undoState;
                endUndo();
                Object.keys(inputs).forEach(f => {
                    inputs[f].value = state.values[f];
                    setInvalid(f, state.invalid.includes(f));
                });
                setSource(state.source);
                copyStatus.textContent = 'Fields restored';
            } else {
                undoState = {
                    values: Object.fromEntries(Object.keys(inputs).map(f => [f, inputs[f].value])),
                    invalid: Object.keys(inputs).filter(isInvalidPanel),
                    source: currentSource
                };
                Object.keys(inputs).forEach(f => { inputs[f].value = ''; setInvalid(f, false); });
                setSource(null);
                clearBtn.textContent = 'Undo clear';
                copyStatus.textContent = 'All fields cleared. Press Undo clear to restore them.';
                undoTimer = setTimeout(() => { endUndo(); refreshUi(); }, 5000);
            }
            refreshUi();
        });

        // Typing or changing a setting after a clear drops the undo.
        document.addEventListener('input', endUndo);

        function refreshUi() {
            refreshCopyButtons();
            refreshWarnings();
            refreshMessages();
            refreshCounts();
            clearBtn.disabled = !undoState && Object.values(inputs).every(i => !i.value);
        }

        // ---- Theme toggle (light by default, choice saved) ----
        const themeToggle = document.getElementById('theme-toggle');

        function syncThemeToggle() {
            const dark = document.documentElement.dataset.theme === 'dark';
            themeToggle.setAttribute('aria-pressed', String(dark));
            themeToggle.title = dark ? 'Light mode' : 'Dark mode';
        }

        themeToggle.addEventListener('click', () => {
            const dark = document.documentElement.dataset.theme !== 'dark';
            if (dark) document.documentElement.dataset.theme = 'dark';
            else delete document.documentElement.dataset.theme;
            try { localStorage.setItem('paulschou.theme', dark ? 'dark' : 'light'); }
            catch (e) { /* not saved: applies to this visit only */ }
            syncThemeToggle();
        });
        syncThemeToggle();

        // Runs after the per-field handlers above (event bubbling order).
        document.addEventListener('input', refreshUi);
        syncSepControls();
        refreshUi();
    </script>
    <script src="freulere.js" defer></script>
</body>
</html>
